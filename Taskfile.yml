version: '3'

vars:
  NVIM_VERSION: v0.11.4
  # The mod's source of truth is the copy committed in this repo. MOD_SRC is only
  # for an author developing it elsewhere (e.g. a `claude --plugin-dir` working
  # copy or ~/.claude/dev-mods/...): `task mod:sync` copies it back in.
  MOD_DIR: .claude/skills/gotutor
  MOD_SRC: '{{.MOD_SRC | default ""}}'

tasks:
  default:
    cmds: [task --list]
    silent: true

  start:
    desc: Start (or attach to) a tmux session running Claude Code in this repo
    cmds:
      - tmux new-session -A -s gotutor -c {{.ROOT_DIR}} claude

  test:
    desc: 'Run a lesson''s tests with the race detector (task test -- lessons/01-foo)'
    cmds:
      - go test -race -count=1 -timeout 20s -v ./{{.CLI_ARGS | default "lessons/..."}}

  edit:
    desc: 'Open the tutor editor on a lesson (task edit -- lessons/01-foo)'
    cmds:
      - editor/tutor-editor.sh open {{.CLI_ARGS}}

  editor:status:
    desc: Show how the tutor editor is attached
    cmds:
      - editor/tutor-editor.sh status

  drill:
    desc: 'Reset a drill to its blank stub, open it, start the clock (task drill -- merge)'
    cmds:
      - drills/drill.sh start {{.CLI_ARGS}}

  drill:check:
    desc: 'Test a drill under -race; on pass, log your time (task drill:check -- merge)'
    cmds:
      - drills/drill.sh check {{.CLI_ARGS}}

  drill:list:
    desc: List drills with attempts, last date, last and best time
    cmds:
      - drills/drill.sh list
    silent: true

  vet:
    desc: go vet every lesson and drill
    cmds:
      - go vet ./lessons/... ./drills/...

  nvim:install:
    desc: Install Neovim {{.NVIM_VERSION}} to ~/.local (no sudo)
    cmds:
      - mkdir -p {{.HOME}}/.local/bin {{.HOME}}/.local/opt
      - curl -fsSL -o /tmp/nvim.tar.gz https://github.com/neovim/neovim/releases/download/{{.NVIM_VERSION}}/nvim-linux-x86_64.tar.gz
      - rm -rf {{.HOME}}/.local/opt/nvim-linux-x86_64
      - tar -xzf /tmp/nvim.tar.gz -C {{.HOME}}/.local/opt
      - ln -sf {{.HOME}}/.local/opt/nvim-linux-x86_64/bin/nvim {{.HOME}}/.local/bin/nvim
      - rm -f /tmp/nvim.tar.gz
      - '{{.HOME}}/.local/bin/nvim --version | head -1'

  mod:check:
    desc: Validate and test the gotutor Claude Code mod
    dir: '{{.MOD_DIR}}'
    cmds:
      - claude plugin validate .
      - claude plugin test .

  mod:sync:
    desc: 'Author only: copy a mod working copy into the repo (MOD_SRC=path task mod:sync)'
    preconditions:
      - sh: test -n "{{.MOD_SRC}}" && test -d "{{.MOD_SRC}}/hooks"
        msg: 'set MOD_SRC to the mod working copy, e.g. MOD_SRC=~/.claude/dev-mods/<id>/gotutor'
    cmds:
      - rsync -a --delete --exclude .claude-plugin/types {{.MOD_SRC}}/ {{.MOD_DIR}}/
